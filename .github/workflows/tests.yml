name: Quality and package

on:
  push:
    branches: [main]
    tags: ["v*-rc.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install project and pinned CI dependencies
        run: |
          python -m pip install -r requirements-ci.txt -r requirements-test.txt
          python -m pip install -e .
      - name: Check Python lint
        run: ruff check src tests
      - name: Check Python formatting
        run: ruff format --check src tests
      - name: Static security scan
        run: bandit -q -r src/tushka
      - name: Audit pinned dependencies
        run: pip-audit -r requirements-ci.txt -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run demo smoke test
        run: python -m tushka.demo

  package:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Build source and wheel distributions
        run: |
          python -m pip install build==1.6.1
          python -m build --sdist --wheel --outdir dist
      - name: Install wheel into an isolated target and smoke test
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/tushka-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/tushka-install" python -m tushka.demo
      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Upload release-ready artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tushka-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tushka-distributions
          path: release-assets
      - name: Publish GitHub prerelease and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/dist/* release-assets/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease


