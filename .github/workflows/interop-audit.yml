name: Temporary OIX fixture quality audit

on:
  push:
    branches: [interop/oix-task-envelope-fixtures]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned test and lint tools
        run: |
          python -m pip install ruff==0.17.6
          python -m pip install -r requirements-test.txt
          python -m pip install -e .
      - name: Check new interoperability test
        run: |
          ruff check tests/test_oix_interop_contract.py
          ruff format --check tests/test_oix_interop_contract.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python -m tushka.demo
