name: Temporary OIX interoperability quality audit

on:
  push:
    branches: [interop/oix-task-envelope-fixtures]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned quality tools and tests
        run: |
          python -m pip install ruff==0.17.6 bandit==1.9.4 pip-audit==2.10.1 build==1.6.1
          python -m pip install -r requirements-test.txt
          python -m pip install -e .
      - name: Ruff lint and format
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Bandit
        run: bandit -q -r src/tushka
      - name: pip-audit
        run: pip-audit -r requirements-test.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python -m tushka.demo
      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist
      - name: Isolated wheel smoke test
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/tushka-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/tushka-install" python -m tushka.demo
