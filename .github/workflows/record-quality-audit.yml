name: Temporary record-contract quality audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.6
      - name: Check lint
        run: ruff check src tests
      - name: Show formatting diff
        run: ruff format --diff src tests
