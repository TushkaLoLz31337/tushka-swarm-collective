name: Temporary record-contract quality audit

on:
  push:
    branches: [governance/record-envelope-contracts-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.6
      - name: Check lint before formatting
        run: ruff check src tests
      - name: Apply Ruff formatting
        run: ruff format src tests
      - name: Verify lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Install project and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run demo smoke test
        run: python -m tushka.demo
      - name: Commit formatting changes to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Ruff formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
