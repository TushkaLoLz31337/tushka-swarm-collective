name: Temporary local broker release gate audit

on:
  push:
    branches: [feature/local-bounded-broker-v1]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned quality tools and project tests
        run: |
          python -m pip install ruff==0.17.6 bandit==1.9.4 pip-audit==2.10.1 build==1.6.1
          python -m pip install -r requirements-test.txt
          python -m pip install -e .
      - name: Check lint before formatting
        run: ruff check src tests
      - name: Apply Ruff formatting
        run: ruff format src tests
      - name: Verify lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Bandit static security scan
        run: bandit -q -r src/tushka
      - name: Audit test dependencies
        run: pip-audit -r requirements-test.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python -m tushka.demo
      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir dist
      - name: Install wheel in isolated target and smoke test
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/tushka-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/tushka-install" python -m tushka.demo
      - name: Commit formatting changes to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Ruff formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
